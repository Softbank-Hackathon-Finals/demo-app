name: transfer-private-image

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Source SHA from the reviewed publication receipt on main
        type: string
        required: true
      publication_record:
        description: Reviewed publication directory already on main
        type: string
        required: false
        default: docs/evidence/image-publication-2026-11-03
      source_digest:
        description: Immutable GHCR index digest from that receipt
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: demo-chat-private-image-transfer
  cancel-in-progress: false

jobs:
  transfer:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: read
      id-token: write
    env:
      PUBLICATION_RECORD_ROOT: ${{ inputs.publication_record || 'docs/evidence/image-publication-2026-11-03' }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      SOURCE_DIGEST: ${{ inputs.source_digest }}
      AWS_REGION: ap-northeast-2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Bind to the reviewed publication and tracked source
        run: |
          python3 scripts/private_image_transfer.py prepare
          python3 scripts/prepare_image_source.py "$SOURCE_SHA" "$RUNNER_TEMP/image-source" "$RUNNER_TEMP/source-manifest.json"
      - name: Install registry copy tool
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq skopeo
      - name: Read private GHCR with this job's temporary token
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Download the exact index and all attestations
        run: python3 scripts/private_image_transfer.py download
      - name: Scan downloaded bytes before private delivery
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          input: ${{ runner.temp }}/source-layout
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: json
          output: ${{ runner.temp }}/transfer-trivy.json
          timeout: 10m
      - name: Obtain a short-lived publisher role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.PRIVATE_IMAGE_PUBLISH_ROLE_ARN }}
          allowed-account-ids: ${{ secrets.PRIVATE_IMAGE_ACCOUNT_ID }}
          aws-region: ap-northeast-2
          role-duration-seconds: 900
          role-session-name: image-transfer-${{ github.run_id }}
          mask-aws-account-id: true
      - name: Authenticate to private ECR
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
        with:
          mask-password: 'true'
      - name: Copy without rebuilding and verify destination bytes
        env:
          PRIVATE_ECR_REPOSITORY: ${{ secrets.PRIVATE_IMAGE_REPOSITORY_URI }}
          EXPECTED_ACCOUNT_ID: ${{ secrets.PRIVATE_IMAGE_ACCOUNT_ID }}
        run: python3 scripts/private_image_transfer.py publish
      - name: Save only bounded delivery evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: private-image-transfer-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/private-transfer-receipt.json
            ${{ runner.temp }}/source-manifest.json
          if-no-files-found: error
          retention-days: 14
